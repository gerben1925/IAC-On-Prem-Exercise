---
- name: Automate LXD Host Initialization & Container Creation
  hosts: homelab
  become: true

  tasks:
    # ----------------------------------------
    # 1. Install & Initialize LXD Engine
    # ----------------------------------------
    - name: Install LXD via Snap
      community.general.snap:
        name: lxd
        state: present

    - name: Initialize LXD Engine
      ansible.builtin.command:
        cmd: lxd init --auto
      register: lxd_init
      changed_when: "'LXD has already been configured' not in lxd_init.stderr"
      failed_when: false

    # ----------------------------------------
    # 2. Server 1 (Database & Management Node)
    # ----------------------------------------
    - name: Check if server1 exists
      ansible.builtin.command:
        cmd: lxc info server1
      register: server1_info
      changed_when: false
      failed_when: false

    - name: Provision Server 1 LXC container
      ansible.builtin.command:
        cmd: lxc launch ubuntu:22.04 server1
      when: server1_info.rc != 0

    - name: Enable Docker nesting on Server 1
      ansible.builtin.command:
        cmd: lxc config set server1 security.nesting true

    - name: Check if Docker is installed on Server 1
      ansible.builtin.command:
        cmd: lxc exec server1 -- docker --version
      register: server1_docker
      changed_when: false
      failed_when: false

    - name: Install Docker Engine inside Server 1
      ansible.builtin.command:
        cmd: >
          lxc exec server1 -- bash -c
          "apt-get update && apt-get install -y docker.io docker-compose-v2"
      when: server1_docker.rc != 0

    - name: Ensure root directory exists on Server 1
      ansible.builtin.command:
        cmd: lxc exec server1 -- mkdir -p /root

    - name: Create Docker Compose file on Server 1
      ansible.builtin.command:
        cmd: |
          lxc exec server1 -- bash -c "cat << 'EOF' > /root/docker-compose.yml
          version: '3.8'

          services:
            minio:
              image: minio/minio
              container_name: minio
              ports:
                - '9000:9000'
                - '9001:9001'
              environment:
                MINIO_ROOT_USER: root
                MINIO_ROOT_PASSWORD: password123
              command: server /data --console-address ':9001'
              restart: always

            mssql:
              image: mcr.microsoft.com/mssql/server:2022-latest
              container_name: mssql
              ports:
                - '1433:1433'
              environment:
                ACCEPT_EULA: 'Y'
                MSSQL_SA_PASSWORD: 'YourStrong!Password123'
              restart: always
          EOF"

    - name: Launch MinIO and SQL Server inside Server 1
      ansible.builtin.command:
        cmd: >
          lxc exec server1 -- bash -c
          "cd /root && docker compose up -d"

    # ----------------------------------------
    # 3. Server 2 (Application Node)
    # ----------------------------------------
    - name: Check if server2 exists
      ansible.builtin.command:
        cmd: lxc info server2
      register: server2_info
      changed_when: false
      failed_when: false

    - name: Provision Server 2 LXC container
      ansible.builtin.command:
        cmd: lxc launch ubuntu:22.04 server2
      when: server2_info.rc != 0

    - name: Enable Docker nesting on Server 2
      ansible.builtin.command:
        cmd: lxc config set server2 security.nesting true

    - name: Check if Docker is installed on Server 2
      ansible.builtin.command:
        cmd: lxc exec server2 -- docker --version
      register: server2_docker
      changed_when: false
      failed_when: false

    - name: Install Docker Engine inside Server 2
      ansible.builtin.command:
        cmd: >
          lxc exec server2 -- bash -c
          "apt-get update && apt-get install -y docker.io docker-compose-v2"
      when: server2_docker.rc != 0