name: "Infrastructure - Bootstrap LXD Host & Servers"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: "Provision LXD Infrastructure"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH Private Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOMELAB_SSH_KEY }}

      - name: Test SSH Connection
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            ${{ secrets.HOMELAB_USER }}@${{ secrets.HOMELAB_IP }} \
            "whoami && hostname && sudo -n whoami"

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible

      - name: Run Ansible Infrastructure Playbook
        env:
          HOMELAB_IP: ${{ secrets.HOMELAB_IP }}
          HOMELAB_USER: ${{ secrets.HOMELAB_USER }}
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False

          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/bootstrap.yml \
            -e "ansible_host=${HOMELAB_IP}" \
            -e "ansible_user=${HOMELAB_USER}"
