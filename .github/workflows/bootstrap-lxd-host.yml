name: "Infrastructure : Bootstrap LXD Host & Servers"

on:
  workflow_dispatch: # Manual execution trigger

permissions:
  contents: read

jobs:
  provision-host:
    name: "Provision LXD Engine & Infrastructure Nodes"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOMELAB_SSH_KEY }}

      - name: Install Ansible Core & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.general

      - name: Execute Ansible Host Bootstrap Playbook
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i ansible/inventory.ini ansible/bootstrap.yml \
            --extra-vars "ansible_host=${{ secrets.HOMELAB_IP }} ansible_user=${{ secrets.HOMELAB_USER }}"