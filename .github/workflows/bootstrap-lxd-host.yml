name: "Infrastructure : Bootstrap LXD Host & Servers"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: "Provision LXD Infrastructure"
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Connect GitHub Actions runner to Tailscale
      # --------------------------------------------------

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.HOMELAB_IP }}

      # --------------------------------------------------
      # 3. Configure SSH private key
      # --------------------------------------------------

      - name: Set up SSH Private Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOMELAB_SSH_KEY }}

      # --------------------------------------------------
      # 4. Install Ansible
      # --------------------------------------------------

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible

      # --------------------------------------------------
      # 5. Verify SSH connection
      # --------------------------------------------------

      - name: Test SSH Connection
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${{ secrets.HOMELAB_USER }}@${{ secrets.HOMELAB_IP }}" \
            "hostname && whoami"

      # --------------------------------------------------
      # 6. Verify Ansible inventory
      # --------------------------------------------------

      - name: Test Ansible Inventory
        run: |
          ansible-inventory \
            -i ansible/inventory.ini \
            --list

      # --------------------------------------------------
      # 7. Test Ansible connectivity
      # --------------------------------------------------

      - name: Test Ansible Connection
        run: |
          ansible homelab \
            -i ansible/inventory.ini \
            -u "${{ secrets.HOMELAB_USER }}" \
            --private-key ~/.ssh/github_actions_homelab \
            -m ping \
            -e "ansible_host=${{ secrets.HOMELAB_IP }}"

      # --------------------------------------------------
      # 8. Run Ansible infrastructure playbook
      # --------------------------------------------------

      - name: Run Ansible Infrastructure Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/bootstrap.yml \
            -u "${{ secrets.HOMELAB_USER }}" \
            --private-key ~/.ssh/github_actions_homelab \
            -e "ansible_host=${{ secrets.HOMELAB_IP }}"
