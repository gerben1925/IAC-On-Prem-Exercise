---
- name: Automate LXD Host Initialization & Container Creation
  hosts: homelab
  become: true

  tasks:
    # --- 1. Install & Initialize LXD ---
    - name: Install LXD via Snap
      snap:
        name: lxd
        state: present

    - name: Initialize LXD Engine
      command: lxd init --auto
      failed_when: false

    # --- 2. Create Server 1 (Database & Management Node) ---
    - name: Provision Server 1 LXC Container
      command: lxc launch ubuntu:22.04 server1

    - name: Enable Docker Nesting on Server 1
      command: lxc config set server1 security.nesting true

    - name: Install Docker Engine inside Server 1
      command: >
        lxc exec server1 -- bash -c 
        "apt-get update && apt-get install -y docker.io docker-compose-v2"

    - name: Copy docker-compose file to Server 1
      command: lxc file push bootstrap/docker-compose.server1.yml server1/root/docker-compose.yml

    - name: Launch MinIO and SQL Server inside Server 1
      command: lxc exec server1 -- bash -c "cd /root && docker compose up -d"

    # --- 3. Create Server 2 (Web Application Host Node) ---
    - name: Provision Server 2 LXC Container
      command: lxc launch ubuntu:22.04 server2

    - name: Enable Docker Nesting on Server 2
      command: lxc config set server2 security.nesting true

    - name: Install Docker Engine inside Server 2
      command: >
        lxc exec server2 -- bash -c 
        "apt-get update && apt-get install -y docker.io docker-compose-v2"